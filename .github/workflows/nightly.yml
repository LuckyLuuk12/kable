name: 'nightly'

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize nightly releases to prevent concurrent build-number allocation.
concurrency:
  group: kable-nightly-release
  cancel-in-progress: false

# This workflow creates a prerelease for each eligible push to main.
# Skip by including [skip nightly], [nightly skip], or [no nightly] in the commit message.

jobs:
  nightly-build:
    if: |
      !contains(github.event.head_commit.message, '[skip nightly]') &&
      !contains(github.event.head_commit.message, '[nightly skip]') &&
      !contains(github.event.head_commit.message, '[no nightly]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.head_commit.message, '[ci skip]')

    permissions:
      contents: write
      discussions: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Get version and commit info
        id: version_info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid stable base version: $VERSION"
            exit 1
          fi

          # Find the highest published nightly build number for this base version.
          RELEASE_NAMES=$(gh release list \
            --limit 1000 \
            --json name \
            --jq '.[].name')

          MAX=0

          while IFS= read -r RELEASE_NAME; do
            if [[ "$RELEASE_NAME" =~ ^Nightly[[:space:]]${VERSION}-([0-9]+)$ ]]; then
              NUMBER="${BASH_REMATCH[1]}"

              # Normalize leading zeros before arithmetic.
              NUMBER=$((10#$NUMBER))

              if (( NUMBER > MAX )); then
                MAX=$NUMBER
              fi
            fi
          done <<< "$RELEASE_NAMES"

          BUILD_NUMBER=$((MAX + 1))

          # MSI requires a build number below 65535.
          if (( BUILD_NUMBER >= 65535 )); then
            echo "Error: Nightly build number ($BUILD_NUMBER) exceeds the supported MSI range."
            exit 1
          fi

          NIGHTLY_VERSION="${VERSION}-${BUILD_NUMBER}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

          echo "Base version: ${VERSION}"
          echo "Nightly version: ${NIGHTLY_VERSION}"
          echo "Commit: ${COMMIT_SHORT}"

          # Get commit messages since the latest nightly tag.
          LAST_NIGHTLY=$(git describe --tags --match "nightly-*" --abbrev=0 2>/dev/null || true)

          if [[ -z "$LAST_NIGHTLY" ]]; then
            COMMITS=$(git log -5 --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log "${LAST_NIGHTLY}..HEAD" --pretty=format:"- %s (%h)")
          fi

          # Create the release body.
          {
            echo "release_body<<EOF"
            echo "🌙 **Nightly Build** - Commit ${COMMIT_SHORT}"
            echo
            echo "This is an automated nightly build from the main branch. It may contain experimental features and bugs."
            echo
            echo "### Recent Changes:"
            if [[ -n "$COMMITS" ]]; then
              echo "$COMMITS"
            else
              echo "- No new commit messages since the previous nightly tag."
            fi
            echo
            echo "**⚠️ Warning**: Nightly builds are unstable and intended for testing purposes only."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update version in tauri.conf.json and Cargo.toml
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ steps.version_info.outputs.nightly_version }}
        run: |
          set -euo pipefail

          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.NIGHTLY_VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

          sed -i -E \
            "s/^version = \".*\"/version = \"${NIGHTLY_VERSION}\"/" \
            src-tauri/Cargo.toml

      - name: Build and publish nightly release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: nightly-${{ steps.version_info.outputs.commit_short }}
          releaseName: 'Nightly ${{ steps.version_info.outputs.nightly_version }}'
          releaseBody: ${{ steps.version_info.outputs.release_body }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
